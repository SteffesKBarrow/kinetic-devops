name: CI Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: Sensitive Data Gate + Python Test Gate (py3.12)
    runs-on:
      - python312

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run sensitive data gate
        run: python scripts/hooks/pre-commit --remote-scan-only

      - name: Run regression suite
        run: python -m tests.test_runner
